name: Agents Baseline Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify-agents-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CORE-DOCTRINE baseline
        shell: bash
        run: |
          set -euo pipefail

          target="AGENTS.md"
          [[ -f "$target" ]] || { echo "AGENTS.md missing" >&2; exit 1; }

          start='<!-- CORE-DOCTRINE:START -->'
          end='<!-- CORE-DOCTRINE:END -->'

          marker_count="$(grep -Ec '<!-- CORE-DOCTRINE:(START|END) -->' "$target")"
          [[ "$marker_count" -eq 2 ]] || { echo "AGENTS.md must contain exactly one CORE-DOCTRINE block" >&2; exit 1; }

          block="$(awk -v s="$start" -v e="$end" '
            BEGIN { capture=0 }
            {
              if (index($0, s)) { capture=1; print; next }
              if (capture) print
              if (index($0, e)) { exit }
            }
          ' "$target")"

          [[ -n "$block" ]] || { echo "CORE-DOCTRINE block is empty" >&2; exit 1; }

          for required in \
            "## Command Doctrine (Solo Leveling Model)" \
            "### Protagonist Commander" \
            "The Seven Shadows" \
            "AI is a force multiplier under command discipline, not a substitute for judgment." \
            "Shadow of Aesthetics" \
            "Shadow of Security" \
            "Shadow of Access" \
            "Shadow of Testing" \
            "Shadow of Execution" \
            "Shadow of Scales" \
            "Shadow of Value" \
            "Script (AI Laws):" \
            "No raw secrets, credentials, or sensitive user data to external AI systems." \
            "TypeScript is the default language for all new implementation work" \
            "TypeScript strict mode is mandatory" \
            "is allowed only at uncontrolled external boundaries and must be narrowed immediately." \
            "Zod is required for TypeScript runtime validation" \
            "Python is a pre-approved exception and must use Pydantic" \
            "Any non-TypeScript/non-Python language requires explicit owner-approved exception." \
            "Language Exception Record" \
            "codex/*" \
            "feature-branch git tree clean before running verification/testing" \
            "never declare completion while the active feature branch is dirty" \
            "behavior-first tests" \
            "hourly/nightly" \
            "weekly/monthly/quarterly"; do
            printf '%s\n' "$block" | grep -Fq "$required" || {
              echo "CORE-DOCTRINE block missing required text: $required" >&2
              exit 1
            }
          done

      - name: Validate reference-first and CSS craft design contract
        shell: bash
        run: |
          set -euo pipefail

          bash -n ops/bootstrap-downstream.sh
          bash -n ops/test-bootstrap-downstream.sh

          for required_file in \
            ingestion/lessons/2026-08-27-reference-first-component-composition.md \
            ingestion/lessons/2026-08-28-css-craft-and-motion.md \
            principles/002-reference-before-invention.md \
            principles/003-behavior-before-decoration.md \
            playbooks/reference-first-design-sop.md \
            playbooks/css-craft-review.md; do
            [[ -s "$required_file" ]] || {
              echo "Reference-first contract file is missing or empty: $required_file" >&2
              exit 1
            }
          done

          grep -Fq 'playbooks/reference-first-design-sop.md' AGENTS.md
          grep -Fq '### Reference and Reuse Decision' templates/design-preflight.md
          grep -Fq '### CSS Craft and Behavior Decision' templates/design-preflight.md
          grep -Fq 'The integrated product, not the source demo' governance/checklist.md
          grep -Fq '## Reference and reuse decision' ops/bootstrap-downstream.sh
          grep -Fq '## CSS craft and behavior summary' ops/bootstrap-downstream.sh
          grep -Fq 'Candidate decisions must include keep, adapt, build, or reject' ops/bootstrap-downstream.sh
          grep -Fq 'No implementation-language change' ops/bootstrap-downstream.sh
          grep -Fq -- '--body "$BOOTSTRAP_PR_BODY"' ops/bootstrap-downstream.sh
          grep -Fq 'No AI is used; this is a deterministic git submodule update.' ops/bootstrap-downstream.sh
          if grep -nE '[[:blank:]]+$' ops/bootstrap-downstream.sh; then
            echo "Downstream bootstrap contains trailing whitespace" >&2
            exit 1
          fi

          ops/test-bootstrap-downstream.sh
